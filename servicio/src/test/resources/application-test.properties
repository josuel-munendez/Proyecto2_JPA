# Perfil de pruebas: MongoDB de Testcontainers, sin dependencias externas.
#
# El contenedor lo aporta TestcontainersConfiguration con @ServiceConnection,
# asi que Spring inyecta la URI automaticamente. No hay ninguna aqui a proposito:
# ponerla en application-test.properties sobrescribiria la del contenedor.

spring.application.name=servicio-mongodb-test

# Los tests no deben tocar ni el Docker Compose de desarrollo ni el Atlas real.
spring.docker.compose.enabled=false

# Se dejan los indices automaticos activos a proposito: los indices unicos de
# nombre y referencia se crean al arrancar el contenedor, que es lo mismo que
# hace Atlas en produccion. Si se desactivaran, los tests no estarian
# ejercitando la restriccion de unicidad real.
spring.data.mongodb.auto-index-creation=true

# La tarea de purga de las 3:00 AM no debe correr durante los tests.
app.purge.scheduler.enabled=false

# Sin llamadas a Django: InterServiceClient va simulado con @MockitoBean.
# La URL es un puerto cerrado a proposito, para que si algun test se olvide de
# la simulacion falle de forma evidente en vez de colarse contra un Django real.
app.django.base-url=http://127.0.0.1:1
app.internal.token=test-token

logging.level.org.mongodb.driver=INFO
logging.level.org.springframework.data.mongodb=WARN
