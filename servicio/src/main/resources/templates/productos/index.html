<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion de Productos - Microservicio JPA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .badge-activo { background-color: #198754; }
        .badge-inactivo { background-color: #6c757d; }
        .badge-borrado { background-color: #dc3545; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestion de Productos (JPA/PostgreSQL)</h2>
        <a href="/productos/nuevo" class="btn btn-primary">+ Nuevo Producto</a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card p-4 mb-4">
        <form method="get" action="/productos" class="row g-3">
            <div class="col-md-9">
                <input type="text" name="search" class="form-control"
                       placeholder="Buscar por Nombre, Descripcion o Referencia..."
                       th:value="${search}">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-outline-secondary w-100">Buscar (OR)</button>
                <a href="/productos" class="btn btn-outline-dark">Limpiar</a>
            </div>
        </form>
    </div>

    <div class="card p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Referencia</th>
                    <th>Nombre</th>
                    <th>Precio Base (COP)</th>
                    <th>Stock</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="prod : ${productosPage.content}">
                    <td th:text="${prod.id}">1</td>
                    <td><code th:text="${prod.referencia}">REF-001</code></td>
                    <td th:text="${prod.nombre}" class="fw-bold">Producto Demo</td>
                    <td th:text="${'$' + #numbers.formatDecimal(prod.precioBase, 1, 'POINT', 2, 'COMMA')}">$50.000</td>
                    <td th:text="${prod.stock}">10</td>
                    <td>
                        <span class="badge" th:classappend="${prod.estado.name() == 'ACTIVO' ? 'badge-activo' : (prod.estado.name() == 'BORRADO' ? 'badge-borrado' : 'badge-inactivo')}" th:text="${prod.estado}">ACTIVO</span>
                    </td>
                    <td>
                        <a th:href="@{'/productos/editar/' + ${prod.id}}" class="btn btn-sm btn-outline-primary">Editar</a>
                        <a th:href="@{'/productos/eliminar/' + ${prod.id}}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Seguro que deseas eliminar este producto?')">Eliminar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productosPage.content)}">
                    <td colspan="7" class="text-center py-4 text-muted">No se encontraron productos en la base de datos.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Paginacion Visual -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
            <span class="text-muted">Pagina <b th:text="${currentPage + 1}">1</b> de <b th:text="${totalPages}">5</b></span>
            <ul class="pagination mb-0">
                <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/productos(page=${currentPage - 1}, search=${search})}">Anterior</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${currentPage == i ? 'active' : ''}">
                    <a class="page-link" th:href="@{/productos(page=${i}, search=${search})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/productos(page=${currentPage + 1}, search=${search})}">Siguiente</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
