spring.application.name=servicio-jpa

# Desactivar Docker Compose integration (usamos Neon remoto, no contenedores locales)
spring.docker.compose.enabled=false

# Puerto de la aplicacion
server.port=8082

# === CONEXION PostgreSQL (misma BD que Django - Neon) ===
# La URL de Neon incluye ?sslmode=require para conexiones seguras
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:10}
