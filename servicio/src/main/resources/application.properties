spring.application.name=servicio-mongodb

# Desactivar Docker Compose integration (usamos MongoDB Atlas remoto)
spring.docker.compose.enabled=false

# Puerto de la aplicacion
server.port=8083

# === CONEXION MongoDB (Atlas compartido con Django) ===
# Sin valor por defecto a proposito: la URI lleva usuario y contrasena de
# Atlas, y dejarla escrita aqui la publica en cuanto esto se sube a Git.
# Se define solo por entorno (SPRING_MONGODB_URI o .env, que esta en
# .gitignore). Ver .env.example para el formato.
#
# OJO con el nombre de la propiedad: Spring Boot 4 movio estas propiedades de
# spring.data.mongodb.* a spring.mongodb.*. La clave antigua sigue apareciendo
# en el metadata, pero marcada como deprecada con nivel "error" y sin efecto
# practico: escribir ahi no falla, simplemente se ignora y Spring arranca con su
# valor por defecto mongodb://localhost:27017/test, SIN credenciales. Eso hacia
# que el catalogo se guardara en el mongod local en lugar de Atlas.
spring.mongodb.uri=${SPRING_MONGODB_URI}

# OJO: en Spring Boot 4 la propiedad auto-index-creation desaparecio. No
# existe ni como spring.mongodb.auto-index-creation ni como la clave antigua
# spring.data.mongodb.auto-index-creation: el metadata de spring-boot-mongodb
# 4.1.1 no las lista, asi que configurarlas no da error y no hace nada. Los
# indices declarados con @Indexed y @CompoundIndex los crea
# MongoIndexInitializer al arrancar.

# === Pool de MongoDB (Atlas sa-east-1) ===
# Los valores por defecto estan en MongoPoolConfig; aqui solo se listan los
# que conviene poder mover por entorno sin recompilar.
# Ponerlos tambien como propiedad permite subirlos sin tocar codigo.
app.mongo.max-pool-size=20
app.mongo.min-pool-size=2
# Atlas escala a cero: una conexion ociosa demasiado tiempo la deja muerta por
# el lado del cluster. Se devuelven antes de que eso pase.
app.mongo.max-connection-idle-time=60s
app.mongo.max-connection-life-time=30m
app.mongo.server-selection-timeout=5s
app.mongo.connect-timeout=10s
app.mongo.socket-timeout=45s
app.mongo.wait-queue-timeout=5s

# === Seguridad ===
# Este servicio NO autentica por si mismo: la identidad la resuelve Django,
# que es quien emite el JWT, y Django a su vez valida el X-Internal-Token en
# /api/internal/. SecurityConfig deja todo en permitAll() y solo añade el
# RateLimitFilter.
#
# Antes aqui havia spring.security.user.name y spring.security.user.password
# fijando una credencial por defecto en el repositorio. Era configuracion
# muerta, porque
# el unico uso posible de esas propiedades es UserDetailsServiceAutoConfiguration,
# que justo se desactiva en la linea siguiente. Se eliminan: una contrasena
# escrita en el repositorio es un riesgo sin contrapartida, y estas no
# protegian nada.
#
# La exclusion se mantiene y ahora es load-bearing: sin ella, Spring Boot
# crearia un usuario por defecto y exigiria autenticacion basica, rompiendo
# todos los endpoints /api/** de arriba.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# === CORS ===
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# === Rate Limiting ===
app.rate-limit.get-per-minute=120
app.rate-limit.post-per-minute=30
app.rate-limit.put-per-minute=30
app.rate-limit.delete-per-minute=20

# === Comunicacion inter-servicio con Django ===
# Django expone los endpoints /api/internal/ y /api/orders/check-product/.
# Se autentican con un token compartido en el header X-Internal-Token, que
# debe coincidir con INTERNAL_API_TOKEN del .env de Django. No es JWT: no hay
# un usuario detras de la llamada.
#
# Si INTERNAL_API_TOKEN no esta definida, el header viaja vacio, Django
# responde 401 y el fail-safe de InterServiceClient.tieneOrdenesAsociadas
# bloquea TODA purga fisica. Arranque con ../start.sh, que exporta la
# variable leyendo el .env de Django.
app.django.base-url=${DJANGO_BASE_URL:http://127.0.0.1:8000}
app.internal.token=${INTERNAL_API_TOKEN:}

# Timeouts cortos a proposito: si Django esta caido no queremos que Spring
# se quede esperando. 3s de conexion + 5s de lectura bastan para un GET local.
app.django.connect-timeout-ms=${DJANGO_CONNECT_TIMEOUT_MS:3000}
app.django.read-timeout-ms=${DJANGO_READ_TIMEOUT_MS:5000}

# === Purga automatica ===
# Tarea de las 3:00 AM que purga productos con soft-delete/desaprobados hace
# mas de 30 dias. Se desactiva para pruebas o para una demo donde no quiera
# que la tarea dispare sola.
app.purge.scheduler.enabled=${PURGE_SCHEDULER_ENABLED:true}
app.dias-gracia-purga=30

# === Paginacion ===
app.producto.default-page-size=10
app.producto.max-page-size=100
app.producto.max-page-number=10000

# === Seguridad del servidor ===
server.tomcat.max-http-form-post-size=128KB
server.tomcat.max-swallow-size=128KB
server.tomcat.max-parameter-count=100
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-exception=false
spring.web.error.include-binding-errors=never
spring.web.error.include-path=never

# === Logging ===
logging.file.name=logs/servicio-mongo.log
logging.logback.rollingpolicy.file-name-pattern=logs/servicio-mongo-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.level.com.example.servicio=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=INFO
