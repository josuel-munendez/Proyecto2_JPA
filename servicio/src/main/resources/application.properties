spring.application.name=servicio-jpa

# Desactivar Docker Compose integration (usamos Neon remoto, no contenedores locales)
spring.docker.compose.enabled=false

# Puerto de la aplicacion
server.port=8082

# === CONEXION PostgreSQL (misma BD que Django - Neon) ===
# La URL de Neon incluye ?sslmode=require para conexiones seguras
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_POOL_SIZE:10}

# === COMUNICACION INTER-SERVICIO CON DJANGO ===
# Estas dos lineas son la QUE connects a Spring con Django. Sin ellas,
# RestClientConfig cae en su default (token vacio) y Django responde 401.
#
# OJO con el nombre de la variable: Spring NO renombra INTERNAL_API_TOKEN a
# app.internal.token. @Value("${app.internal.token}") solo encuentra la variable
# de entorno APP_INTERNAL_TOKEN. Por eso se declara el placeholder aqui
# apuntando al nombre real que exporta start.sh (INTERNAL_API_TOKEN), y no se
# deja que el @Value lo busque solo.
app.internal.token=${INTERNAL_API_TOKEN:}
app.django.base-url=${DJANGO_BASE_URL:http://127.0.0.1:8000}
app.django.connect-timeout-ms=${DJANGO_CONNECT_TIMEOUT_MS:3000}
app.django.read-timeout-ms=${DJANGO_READ_TIMEOUT_MS:5000}
